# Levanta la base de datos, aplica las migraciones y arranca la API:
#   docker compose up --build
# Los valores secretos se leen del archivo .env (ver .env.example).

# Cadena de conexión compartida por las migraciones y la API.
# "db" es el nombre del servicio de PostgreSQL dentro de la red de compose.
x-conexion: &conexion
  ConnectionStrings__FerreApi: "Host=db;Port=5432;Database=ferreapi;Username=postgres;Password=${POSTGRES_PASSWORD}"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ferreapi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ferreapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  migraciones:
    build:
      context: .
      target: migraciones
    environment:
      <<: *conexion
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: final
    ports:
      - "8080:8080"
    environment:
      <<: *conexion
      Jwt__Clave: ${JWT_CLAVE:?Define JWT_CLAVE en el archivo .env}
      AdminInicial__Email: ${ADMIN_EMAIL:?Define ADMIN_EMAIL en el archivo .env}
      AdminInicial__Password: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en el archivo .env}
    depends_on:
      migraciones:
        condition: service_completed_successfully

volumes:
  datos-postgres:
